<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeliX Control Panel</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">B</span><div><strong>BeliX</strong><small>Bot control panel</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-page="overview">◈ <span>Overview</span></button>
        <button class="nav-item" data-page="bot">● <span>Bot Management</span></button>
        <button class="nav-item" data-page="server">▣ <span>Server Management</span></button>
        <button class="nav-item" data-page="members">♙ <span>Member Management</span></button>
        <button class="nav-item" data-page="commands">⌘ <span>Commands</span></button>
        <button class="nav-item" data-page="moderation">✓ <span>Moderation</span></button>
        <button class="nav-item" data-page="ai">✦ <span>Blix AI</span></button>
        <button class="nav-item" data-page="gatherings">◉ <span>Daily Gatherings</span></button>
        <button class="nav-item" data-page="attendance">◷ <span>Attendance</span></button>
        <button class="nav-item" data-page="reports">▥ <span>Reports & Analytics</span></button>
        <button class="nav-item" data-page="logs">≡ <span>Activity Logs</span></button>
        <button class="nav-item" data-page="integrations">⌁ <span>Integrations</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span id="connection-text">Connecting...</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow">DISCORD BOT MANAGEMENT</div><h1 id="page-title">Overview</h1></div>
        <div class="top-actions"><span class="server-pill">◈ <span id="server-name">Loading server...</span></span><button class="icon-button" id="refresh">↻</button><button class="profile">Admin <span>⌄</span></button></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/dashboard.js"></script>
</body>
</html>
